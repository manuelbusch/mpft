[book]
title = "Multi Protocol Transceiver (User Guide)"
authors = ["Manuel Busch"]
language = "en"
src = "src"

[build]
# A page listed in SUMMARY.md but missing on disk is an error, not a stub
# that mdbook quietly creates.
create-missing = false

[output.html]
default-theme = "rust"
preferred-dark-theme = "navy"
smart-punctuation = true
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[preprocessor.mermaid]
command = "mdbook-mermaid"
