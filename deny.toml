# cargo-deny: licences, advisories, duplicate and unexpected dependencies.
# Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
  # Marvin attack (timing side channel in RSA). No fixed release exists: the
  # `rsa` crate has carried this since 2023. It reaches us only through
  # `pgp` and `russh`/`ssh-key`, which pull it in for RSA keys. We never
  # decrypt with an RSA key — the crate signs and verifies — and the attack
  # needs an oracle the attacker can time repeatedly. Revisit whenever `rsa`
  # publishes a fix; the ed25519 keys we recommend are unaffected either way.
  { id = "RUSTSEC-2023-0071", reason = "no fix available; we only sign and verify, never decrypt" },
]

[licenses]
# Permissive licences only. Anything copyleft has to be discussed rather than
# silently pulled in.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # Permissive one-offs pulled in by dependencies:
  "0BSD",                 # quoted_printable (via lettre)
  "bzip2-1.0.6",          # libbz2-rs-sys (via the compression stack)
  "CDLA-Permissive-2.0",  # webpki-root-certs, the Mozilla root store data
]
confidence-threshold = 0.9

[bans]
# Duplicates are a warning, not an error: the release-candidate RustCrypto
# crates that ssh-key 0.7.0-rc pulls in sit next to the stable ones that pgp
# uses, which is a good sixty duplicates we cannot resolve from here.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
