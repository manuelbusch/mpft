[package]
name = "multi_protocol_transceiver"
version = "0.1.0"
edition = "2024"
# Verified with `cargo +1.89.0 check --all-features --all-targets`; russh and
# aes need 1.89, the crate itself would build on less.
rust-version = "1.89"
description = "Send and receive files over many protocols, addressed by URL prefix (sftp://, ftps://, s3://, mailto:, ...)"
license = "MIT OR Apache-2.0"

[lib]
name = "mpt"
path = "src/lib.rs"

[[bin]]
name = "mpt"
path = "src/main.rs"

[features]
default = ["all"]
all = ["ssh", "ftp", "http", "webdav", "s3", "mail", "sign-ssh", "sign-pgp"]
ssh = ["dep:russh", "dep:russh-sftp", "dep:dirs", "dep:pageant"]
ftp = ["dep:suppaftp", "dep:tokio-rustls", "dep:rustls-platform-verifier"]
http = ["dep:reqwest"]
webdav = ["http", "dep:reqwest_dav"]
s3 = ["dep:object_store"]
mail = ["dep:lettre"]
sign-ssh = ["dep:ssh-key", "dep:dirs"]
sign-pgp = ["dep:pgp", "dep:rand"]
# credential providers that need more than the process itself
s3-aws-auth = ["s3", "dep:aws-config", "dep:aws-credential-types"]
keyring = ["dep:keyring"]
vault = ["dep:reqwest", "reqwest/json"]

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs", "io-util", "net", "process", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }  # sync::CancellationToken needs no feature
futures = "0.3"
async-trait = "0.1"
url = "2.5"
percent-encoding = "2.3"
thiserror = "2.0"
tracing = "0.1"
mime_guess = "2.0"
bytes = "1"
sha2 = "0.10"
blake3 = "1"
hex = "0.4"
signature = "3"
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

# CLI
clap = { version = "4.6", features = ["derive", "env"] }
anstream = "0.6"
clap_complete = "4.6"
clap_mangen = "0.2"
anstyle = "1"
anyhow = "1.0"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ssh
russh = { version = "0.63", optional = true }
russh-sftp = { version = "3.0", optional = true }
dirs = { version = "6", optional = true }

# ftp
suppaftp = { version = "12.0", optional = true, default-features = false, features = ["tokio", "tokio-rustls-aws-lc-rs", "deprecated"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["aws-lc-rs", "tls12"] }
rustls-platform-verifier = { version = "0.7", optional = true }

# http / webdav
reqwest = { version = "0.13", optional = true, features = ["stream"] }
reqwest_dav = { version = "0.3", optional = true, default-features = false, features = ["rustls-tls"] }

# s3
object_store = { version = "0.14", optional = true, features = ["aws"] }
# the AWS credential chain (SSO cache, profiles, AssumeRole, IMDS)
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }

# signing
ssh-key = { version = "0.7.0-rc.11", optional = true, default-features = false, features = ["std", "alloc", "ed25519", "rsa", "ecdsa", "p256", "p384", "rand_core", "encryption"] }
pgp = { version = "0.20", optional = true }
rand = { version = "0.8", optional = true }

# mail
lettre = { version = "0.11", optional = true, default-features = false, features = ["smtp-transport", "builder", "hostname", "pool", "tokio1", "tokio1-rustls", "aws-lc-rs", "rustls-platform-verifier"] }

tempfile = "3"
secrecy = "0.10.3"

# configuration file
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# job lists for `mpt batch`: shell-style quoting and CSV
shlex = "1.3"
csv = "1.3"
glob = "0.3"

# credential providers (serde_json is also the --json report)
keyring = { version = "3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service"] }
serde_json = "1"

# Windows: PuTTY's Pageant as a second kind of ssh-agent, next to the named
# pipe of the Windows OpenSSH agent. Same version russh itself uses.
[target.'cfg(windows)'.dependencies]
pageant = { version = "0.2", optional = true }

[dev-dependencies]
proptest = "1.11.0"
tempfile = "3"
# start_paused for tests that would otherwise wait out a retry backoff
tokio = { version = "1.53", features = ["test-util"] }
