name: CI

on:
  push:
    branches: [main, test-ci]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt and clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-features --all-targets -- -D warnings
      # the smallest build: no protocol beyond local files
      - run: cargo check --no-default-features --lib --tests

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      # Unit tests, CLI, relay and server tests. The end-to-end suite in
      # tests/integration.rs skips itself here: no MPFT_IT_* is set.
      - run: cargo test --all-features

  # The scripts under tests/local/ do not run on Windows, so this job builds
  # everything and runs the unit tests only (see docs/DEVELOPMENT.md).
  windows:
    name: test (windows-latest, unit)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-features --all-targets
      - run: cargo test --all-features --lib

  integration:
    name: integration (local servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system libraries and sshd
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config openssh-server netcat-openbsd
          # sshd refuses to start without its privilege separation directory
          sudo mkdir -p /run/sshd
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: Swatinem/rust-cache@v2
      - name: Build the tests
        run: cargo test --all-features --test integration --no-run
      - name: Start the test servers
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet pyftpdlib pyopenssl aiosmtpd "moto[server]" wsgidav cheroot
          bash tests/local/start_servers.sh .venv "$RUNNER_TEMP/mpft-it"
      - name: Run the end-to-end tests
        run: |
          source "$RUNNER_TEMP/mpft-it/env.sh"
          cargo test --all-features --test integration
      - name: Show the server logs
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP"/mpft-it/logs/*.log
      - name: Stop the test servers
        if: always()
        run: bash tests/local/stop_servers.sh "$RUNNER_TEMP/mpft-it"

  msrv:
    name: minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features --all-targets

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
